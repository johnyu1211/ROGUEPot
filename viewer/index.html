<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéRogue Bot - Discord UI Simulator</title>
  <style>
    :root {
      --bg-app: #1E1F22;
      --bg-chat: #313338;
      --bg-message: #2B2D31;
      --border-color: #3F4147;
      
      /* Discord Official Button Styles */
      --btn-primary: #5865F2;
      --btn-primary-hover: #4752C4;
      --btn-secondary: #4E5058;
      --btn-secondary-hover: #6D6F78;
      --btn-success: #248046;
      --btn-success-hover: #1A6334;
      --btn-danger: #DA373C;
      --btn-danger-hover: #A12828;

      --text-normal: #DBDEE1;
      --text-muted: #949BA4;
      --text-header: #F2F3F5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'gg sans', 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-normal);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Nav */
    header {
      background-color: #111214;
      border-bottom: 1px solid #232428;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-header);
    }

    .badge {
      background: var(--btn-primary);
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    select, button {
      font-family: inherit;
    }

    select {
      background: #2B2D31;
      border: 1px solid #3F4147;
      color: white;
      padding: 7px 12px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }

    select:focus {
      border-color: var(--btn-primary);
    }

    /* Main Chat Layout */
    .chat-container {
      flex: 1;
      display: flex;
      justify-content: center;
      background-color: var(--bg-chat);
      padding: 20px;
      overflow-y: auto;
    }

    /* Discord Message Card */
    .discord-message {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bot-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #5865F2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .bot-info {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bot-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-header);
    }

    .bot-tag {
      background: #5865F2;
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 3px;
      text-transform: uppercase;
    }

    .msg-timestamp {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 4px;
    }

    /* Attachment Canvas Container */
    .attachment-card {
      background-color: #0E1017;
      border-radius: 8px;
      overflow: hidden;
      display: inline-block;
      width: 560px;
      height: 380px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    #canvas-preview {
      display: block;
      width: 560px;
      height: 380px;
      image-rendering: pixelated;
    }

    /* Discord ActionRows (Buttons) */
    .discord-action-rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 560px;
    }

    .action-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .action-row > * {
      flex: 1;
    }

    /* Discord Official Button Styling */
    .d-btn {
      height: 38px;
      padding: 2px 14px;
      border-radius: 4px;
      border: none;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.17s ease, color 0.17s ease;
      white-space: nowrap;
      user-select: none;
    }

    .d-btn.primary {
      background-color: var(--btn-primary);
      color: #FFFFFF;
    }
    .d-btn.primary:hover:not(:disabled) {
      background-color: var(--btn-primary-hover);
    }

    .d-btn.secondary {
      background-color: var(--btn-secondary);
      color: #FFFFFF;
    }
    .d-btn.secondary:hover:not(:disabled) {
      background-color: var(--btn-secondary-hover);
    }

    .d-btn.success {
      background-color: var(--btn-success);
      color: #FFFFFF;
    }
    .d-btn.success:hover:not(:disabled) {
      background-color: var(--btn-success-hover);
    }

    .d-btn.danger {
      background-color: var(--btn-danger);
      color: #FFFFFF;
    }
    .d-btn.danger:hover:not(:disabled) {
      background-color: var(--btn-danger-hover);
    }

    .d-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .scale-btn {
      background: #2B2D31;
      border: 1px solid #3F4147;
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .scale-btn.active {
      color: white;
      background: var(--btn-primary);
      border-color: var(--btn-primary);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>🤖 PokéRogue Discord UI Simulator</h1>
      <span class="badge">Live 0ms Emulation</span>
    </div>
    <div class="toolbar">
      <div class="scale-controls">
        <button class="scale-btn" onclick="setScale(1)">100%</button>
        <button class="scale-btn active" onclick="setScale(1.25)">125%</button>
        <button class="scale-btn" onclick="setScale(1.5)">150%</button>
      </div>
      <select id="screen-select" onchange="onScreenChange()">
        <option value="starter_party">⭐ 스타팅 파티 관리 (Party Customization)</option>
        <option value="starter_select">🔍 스타팅 포켓몬 선택 (Starter Select)</option>
        <option value="pokedex">📚 포켓몬 도감 (Pokédex)</option>
        <option value="bag">🎒 트레이너 가방 (Trainer Bag)</option>
        <option value="multiplayer">🌐 멀티플레이 로비 (Multiplayer)</option>
        <option value="gacha">🥚 알 부화기 (Egg Gacha)</option>
        <option value="gen_select">🗺️ 세대 선택 화면 (Gen Select)</option>
        <option value="title">🕹️ 메인 타이틀 화면 (Title Screen)</option>
      </select>
      <button class="d-btn primary" onclick="renderState()" style="height: 32px; padding: 0 12px; font-size: 12px;">
        🔄 즉시 새로고침
      </button>
    </div>
  </header>

  <div class="chat-container">
    <div class="discord-message" id="message-box">
      <div class="message-header">
        <div class="bot-avatar">🎮</div>
        <div class="bot-info">
          <span class="bot-name">ROGUEPot</span>
          <span class="bot-tag">BOT</span>
          <span class="msg-timestamp">오늘 오후 2:55</span>
        </div>
      </div>

      <!-- 1. Canvas Image Attachment -->
      <div class="attachment-card" id="attachment-wrapper">
        <img id="canvas-preview" src="" alt="Discord Bot Canvas">
      </div>

      <!-- 2. Discord ActionRows (Real Component Buttons) -->
      <div class="discord-action-rows" id="action-rows">
        <!-- Rendered dynamically matching interactionCreate.ts -->
      </div>
    </div>
  </div>

  <script>
    let state = {
      screen: "starter_party",
      selectedPartyIdx: 1, // 0 = P1 (팽도리), 1 = P2 (이상해씨)
      partyTab: "moves",   // "moves" | "shiny" | "cost" | "learnable"
      selectedMoveIdx: 1,  // 0 ~ 3
      currentGen: 1,
      currentPage: 1,
      totalPages: 4,
      isShinyFilter: false,
      isHaFilter: false,
      isPassiveFilter: false,
      party: [
        { dexNumber: 393, speciesId: "piplup", name: "팽도리", cost: 3, isShiny: false, usePassive: false, useHiddenAbility: false },
        { dexNumber: 1, speciesId: "bulbasaur", name: "이상해씨", cost: 2, isShiny: false, usePassive: true, useHiddenAbility: false }
      ],
      userCandies: 50,
      moves: {
        bulbasaur: ["Tackle", "Growl", "Vine Whip"],
        piplup: ["Pound", "Growl", "Water Gun"]
      },
      movesKo: {
        "Tackle": "몸통박치기",
        "Growl": "울음소리",
        "Vine Whip": "덩굴채찍",
        "Pound": "막치기",
        "Water Gun": "물대포"
      }
    };

    function setScale(scale) {
      document.querySelectorAll('.scale-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === `${scale * 100}%`);
      });
      const wrapper = document.getElementById('attachment-wrapper');
      const img = document.getElementById('canvas-preview');
      const rows = document.getElementById('action-rows');
      
      const w = 560 * scale;
      const h = 380 * scale;
      wrapper.style.width = `${w}px`;
      wrapper.style.height = `${h}px`;
      img.style.width = `${w}px`;
      img.style.height = `${h}px`;
      rows.style.width = `${w}px`;
      document.getElementById('message-box').style.maxWidth = `${Math.max(600, w + 40)}px`;
    }

    async function renderState() {
      try {
        const res = await fetch('/api/render', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state)
        });
        const data = await res.json();
        if (data.image) {
          document.getElementById('canvas-preview').src = data.image;
        }
      } catch (err) {
        console.error('Render error:', err);
      }
    }

    function onScreenChange() {
      state.screen = document.getElementById('screen-select').value;
      renderButtons();
      renderState();
    }

    // Party interaction handlers
    function pickParty(idx) {
      state.selectedPartyIdx = idx;
      state.selectedMoveIdx = 0; // Party pick always resets moveIdx to 0
      renderButtons();
      renderState();
    }

    function pickTab(tab) {
      state.partyTab = tab;
      renderButtons();
      renderState();
    }

    function pickMove(idx) {
      state.selectedMoveIdx = idx;
      renderButtons();
      renderState();
    }

    function toggleHa() {
      const p = state.party[state.selectedPartyIdx];
      if (p) {
        p.useHiddenAbility = !p.useHiddenAbility;
        renderButtons();
        renderState();
      }
    }

    function togglePassive() {
      const p = state.party[state.selectedPartyIdx];
      if (p) {
        p.usePassive = !p.usePassive;
        renderButtons();
        renderState();
      }
    }

    function removeCurrentParty() {
      if (state.party.length > 0 && state.selectedPartyIdx < state.party.length) {
        state.party.splice(state.selectedPartyIdx, 1);
        state.selectedPartyIdx = Math.max(0, state.party.length - 1);
        renderButtons();
        renderState();
      }
    }

    // Starter Select Handlers
    function changeGen(gen) {
      state.currentGen = gen;
      state.currentPage = 1;
      renderButtons();
      renderState();
    }

    function changePage(delta) {
      state.currentPage = Math.max(1, Math.min(state.totalPages, state.currentPage + delta));
      renderButtons();
      renderState();
    }

    function toggleFilter(filter) {
      if (filter === 'shiny') state.isShinyFilter = !state.isShinyFilter;
      if (filter === 'ha') state.isHaFilter = !state.isHaFilter;
      if (filter === 'passive') state.isPassiveFilter = !state.isPassiveFilter;
      renderButtons();
      renderState();
    }

    function renderButtons() {
      const container = document.getElementById('action-rows');
      container.innerHTML = '';

      if (state.screen === 'starter_party') {
        const curMember = state.party[state.selectedPartyIdx];
        const isPiplup = curMember?.speciesId === 'piplup';
        const isBulba = curMember?.speciesId === 'bulbasaur';

        const normalAb = isPiplup ? "급류" : (isBulba ? "심록" : "-");
        const haAb = isPiplup ? "-" : (isBulba ? "엽록소" : "-");
        const passAb = isPiplup ? "미해금" : (isBulba ? "부식" : "-");

        const curMoves = isPiplup ? ["Pound", "Growl", "Water Gun"] : ["Tackle", "Growl", "Vine Whip"];

        // ROW 1: Ability / Hidden Ability / Passive
        container.innerHTML += `
          <div class="action-row">
            <button class="d-btn ${!curMember?.useHiddenAbility ? 'success' : 'primary'}" onclick="toggleHa()">
              🌟 특성: ${normalAb}
            </button>
            <button class="d-btn ${curMember?.useHiddenAbility ? 'success' : 'secondary'}" ${!isBulba ? 'disabled' : ''} onclick="toggleHa()">
              ${isBulba ? (curMember?.useHiddenAbility ? `🌟 숨특: ${haAb}` : `🔒 숨특: ${haAb}`) : '🔒 숨특: -'}
            </button>
            <button class="d-btn ${curMember?.usePassive ? 'success' : 'primary'}" ${!isBulba ? 'disabled' : ''} onclick="togglePassive()">
              ${isBulba ? (curMember?.usePassive ? `🔓 패시브: ${passAb}` : `🔒 패시브: ${passAb}`) : '🔒 패시브: -'}
            </button>
          </div>
        `;

        // ROW 2: P1, P2 + [⚔️ 기술 관리] + [✨ 이로치 폼] + [🍬 코스트]
        container.innerHTML += `
          <div class="action-row">
            <button class="d-btn ${state.selectedPartyIdx === 0 ? 'primary' : 'secondary'}" ${state.selectedPartyIdx === 0 ? 'disabled' : ''} onclick="pickParty(0)">P1</button>
            <button class="d-btn ${state.selectedPartyIdx === 1 ? 'primary' : 'secondary'}" ${state.selectedPartyIdx === 1 ? 'disabled' : ''} onclick="pickParty(1)">P2</button>
            <button class="d-btn ${state.partyTab === 'moves' ? 'primary' : 'secondary'}" onclick="pickTab('moves')">⚔️ 기술 관리</button>
            <button class="d-btn ${state.partyTab === 'shiny' ? 'primary' : 'secondary'}" onclick="pickTab('shiny')">✨ 이로치 폼</button>
            <button class="d-btn ${state.partyTab === 'cost' ? 'primary' : 'secondary'}" onclick="pickTab('cost')">🍬 코스트</button>
          </div>
        `;

        // ROW 3: P3, P4 + Move 1 + Move 2 + [📚 기술 목록]
        const m1 = curMoves[0] ? state.movesKo[curMoves[0]] : '-';
        const m2 = curMoves[1] ? state.movesKo[curMoves[1]] : '-';
        container.innerHTML += `
          <div class="action-row">
            <button class="d-btn secondary" disabled>P3</button>
            <button class="d-btn secondary" disabled>P4</button>
            <button class="d-btn ${state.selectedMoveIdx === 0 ? 'primary' : 'secondary'}" ${state.selectedMoveIdx === 0 ? 'disabled' : ''} onclick="pickMove(0)">${m1}</button>
            <button class="d-btn ${state.selectedMoveIdx === 1 ? 'primary' : 'secondary'}" ${state.selectedMoveIdx === 1 ? 'disabled' : ''} onclick="pickMove(1)">${m2}</button>
            <button class="d-btn secondary" onclick="pickTab('learnable')">📚 기술 목록</button>
          </div>
        `;

        // ROW 4: P5, P6 + Move 3 + Move 4
        const m3 = curMoves[2] ? state.movesKo[curMoves[2]] : '-';
        const m4 = curMoves[3] ? state.movesKo[curMoves[3]] : '-';
        container.innerHTML += `
          <div class="action-row">
            <button class="d-btn secondary" disabled>P5</button>
            <button class="d-btn secondary" disabled>P6</button>
            <button class="d-btn ${state.selectedMoveIdx === 2 ? 'primary' : 'secondary'}" ${state.selectedMoveIdx === 2 ? 'disabled' : ''} onclick="pickMove(2)">${m3}</button>
            <button class="d-btn secondary" disabled>${m4}</button>
          </div>
        `;

        // ROW 5: [-⚪ 파티 제외] + [↩️ 스타팅 목록]
        container.innerHTML += `
          <div class="action-row">
            <button class="d-btn danger" onclick="removeCurrentParty()">-⚪ 파티 제외</button>
            <button class="d-btn danger" onclick="onScreenChange()">↩️ 스타팅 목록</button>
          </div>
        `;
      } else if (state.screen === 'starter_select') {
        // ROW 1: Generation & Filters
        container.innerHTML += `
          <div class="action-row">
            <button class="d-btn primary" onclick="changeGen((state.currentGen % 9) + 1)">세대: G${state.currentGen}</button>
            <button class="d-btn ${state.isPassiveFilter ? 'success' : 'secondary'}" onclick="toggleFilter('passive')">PS 패시브</button>
            <button class="d-btn ${state.isHaFilter ? 'danger' : 'secondary'}" onclick="toggleFilter('ha')">HA 숨특</button>
            <button class="d-btn ${state.isShinyFilter ? 'primary' : 'secondary'}" onclick="toggleFilter('shiny')">✨ 이로치</button>
          </div>
        `;

        // ROW 2: Starters 1~4
        container.innerHTML += `
          <div class="action-row">
            <button class="d-btn primary">1. 이상해씨</button>
            <button class="d-btn secondary">2. 파이리</button>
            <button class="d-btn secondary">3. 꼬부기</button>
            <button class="d-btn secondary">4. 피카츄</button>
          </div>
        `;

        // ROW 3: Starters 5~8
        container.innerHTML += `
          <div class="action-row">
            <button class="d-btn secondary">5. 이브이</button>
            <button class="d-btn secondary">6. 캐터피</button>
            <button class="d-btn secondary">7. 뿔충이</button>
            <button class="d-btn secondary">8. 구구</button>
          </div>
        `;

        // ROW 4: Starters 9~12
        container.innerHTML += `
          <div class="action-row">
            <button class="d-btn secondary">9. 꼬렛</button>
            <button class="d-btn secondary">10. 깨비참</button>
            <button class="d-btn secondary">11. 아보</button>
            <button class="d-btn secondary">12. 모래두지</button>
          </div>
        `;

        // ROW 5: Nav & Action
        container.innerHTML += `
          <div class="action-row">
            <button class="d-btn secondary" onclick="changePage(-1)">◀ 이전</button>
            <button class="d-btn success">+⚪ 파티 추가</button>
            <button class="d-btn primary" onclick="state.screen='starter_party'; renderButtons(); renderState();">👥 파티 관리 (${state.party.length}/6)</button>
            <button class="d-btn secondary" onclick="changePage(1)">다음 ▶</button>
            <button class="d-btn success">⚔️ 모험 시작</button>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="action-row">
            <button class="d-btn primary" onclick="state.screen='starter_party'; renderButtons(); renderState();">👥 파티 관리 화면으로 이동</button>
            <button class="d-btn secondary" onclick="state.screen='starter_select'; renderButtons(); renderState();">🔍 스타팅 선택 화면으로 이동</button>
          </div>
        `;
      }
    }

    // Initialize
    setScale(1.25);
    renderButtons();
    renderState();
  </script>
</body>
</html>
