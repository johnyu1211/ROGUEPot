<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéRogue Bot - Discord UI Simulator</title>
  <style>
    :root {
      --bg-app: #1E1F22;
      --bg-chat: #313338;
      
      /* Discord Official Button Styles (Exact Discord Client Palette) */
      --btn-primary: #5865F2;
      --btn-primary-hover: #4752C4;
      --btn-primary-active: #3C45A5;

      --btn-secondary: #4E5058;
      --btn-secondary-hover: #6D6F78;
      --btn-secondary-active: #80848E;

      --btn-success: #248046;
      --btn-success-hover: #1A6334;
      --btn-success-active: #144D28;

      --btn-danger: #DA373C;
      --btn-danger-hover: #A12828;
      --btn-danger-active: #852020;

      --text-normal: #DBDEE1;
      --text-muted: #949BA4;
      --text-header: #F2F3F5;
      --font-discord: 'gg sans', 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-app);
      color: var(--text-normal);
      font-family: var(--font-discord);
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Top Bar */
    header {
      background-color: #111214;
      border-bottom: 1px solid #232428;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-header);
    }

    .badge {
      background: var(--btn-primary);
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select, button {
      font-family: inherit;
    }

    select {
      background: #2B2D31;
      border: 1px solid #3F4147;
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }

    /* Discord Chat Channel Emulation */
    .chat-container {
      width: 100%;
      min-height: calc(100vh - 60px);
      background-color: var(--bg-chat);
      display: flex;
      justify-content: flex-start;
      padding: 24px 20px 48px;
    }

    .discord-message-group {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 900px;
    }

    .bot-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #5865F2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      user-select: none;
    }

    .message-content-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .message-header {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .bot-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-header);
    }

    .bot-tag {
      background: #5865F2;
      color: white;
      font-size: 10px;
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 3px;
      text-transform: uppercase;
      line-height: 14px;
      vertical-align: middle;
    }

    .msg-timestamp {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 4px;
    }

    /* Attachment Canvas Container (Exact 560x380 Native Display) */
    .attachment-card {
      background-color: #11131C;
      border-radius: 8px;
      overflow: hidden;
      width: 560px;
      height: 380px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      margin-top: 4px;
    }

    #canvas-preview {
      display: block;
      width: 560px;
      height: 380px;
      image-rendering: pixelated;
    }

    /* Discord Embed Message Container */
    .embed-card {
      background-color: #2B2D31;
      border-left: 4px solid var(--btn-primary);
      border-radius: 4px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 560px;
      margin-top: 4px;
    }

    .embed-title {
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
    }

    .embed-desc {
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text-normal);
      white-space: pre-wrap;
    }

    /* Discord Native ActionRows (NOT a rigid grid, matches Discord native flex layout 1:1) */
    .discord-action-rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
      max-width: 560px;
    }

    .action-row {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 8px;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
    }

    /* Discord Native Button Component */
    .d-btn {
      height: 32px;
      min-height: 32px;
      min-width: 60px;
      width: auto;
      max-width: 100%;
      padding: 2px 16px;
      border-radius: 3px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      line-height: 16px;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.17s ease, color 0.17s ease;
      white-space: nowrap;
      user-select: none;
      box-sizing: border-box;
      flex: 0 0 auto;
    }

    /* Primary (Blurple) */
    .d-btn.btn-1 {
      background-color: var(--btn-primary);
      color: #FFFFFF;
    }
    .d-btn.btn-1:hover:not(:disabled) {
      background-color: var(--btn-primary-hover);
    }
    .d-btn.btn-1:active:not(:disabled) {
      background-color: var(--btn-primary-active);
    }

    /* Secondary (Dark Grey) */
    .d-btn.btn-2 {
      background-color: var(--btn-secondary);
      color: #FFFFFF;
    }
    .d-btn.btn-2:hover:not(:disabled) {
      background-color: var(--btn-secondary-hover);
    }
    .d-btn.btn-2:active:not(:disabled) {
      background-color: var(--btn-secondary-active);
    }

    /* Success (Green) */
    .d-btn.btn-3 {
      background-color: var(--btn-success);
      color: #FFFFFF;
    }
    .d-btn.btn-3:hover:not(:disabled) {
      background-color: var(--btn-success-hover);
    }
    .d-btn.btn-3:active:not(:disabled) {
      background-color: var(--btn-success-active);
    }

    /* Danger (Red) */
    .d-btn.btn-4 {
      background-color: var(--btn-danger);
      color: #FFFFFF;
    }
    .d-btn.btn-4:hover:not(:disabled) {
      background-color: var(--btn-danger-hover);
    }
    .d-btn.btn-4:active:not(:disabled) {
      background-color: var(--btn-danger-active);
    }

    .d-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>🎮 ROGUEPot UI Viewer (Live Discord Runtime)</h1>
      <span class="badge">100% Native Discord Layout</span>
    </div>
    <div class="toolbar">
      <select id="screen-select" onchange="onScreenChange()">
        <option value="title">🕹️ 첫 화면: 타이틀 화면 (Title Screen)</option>
        <option value="slots">💾 세이브 슬롯 선택 (Save Slots)</option>
        <option value="starter_select">🔍 스타팅 포켓몬 선택 (Starter Select)</option>
        <option value="party">⭐ 스타팅 파티 관리 (Party Customization)</option>
        <option value="bag">🎒 트레이너 가방 (Trainer Bag)</option>
        <option value="multiplayer">🌐 멀티플레이 로비 (Multiplayer)</option>
      </select>
      <button class="d-btn btn-1" onclick="reloadCurrentView()" style="height: 30px; padding: 0 12px; font-size: 13px;">
        🔄 새로고침
      </button>
    </div>
  </header>

  <div class="chat-container">
    <div class="discord-message-group">
      <div class="bot-avatar">🎮</div>
      <div class="message-content-wrapper">
        <div class="message-header">
          <span class="bot-name">ROGUEPot</span>
          <span class="bot-tag">BOT</span>
          <span class="msg-timestamp">오늘 오후 3:00</span>
        </div>

        <!-- 1. Canvas Image Attachment (560x380) -->
        <div class="attachment-card" id="canvas-card">
          <img id="canvas-preview" src="" alt="Discord Bot Canvas Attachment">
        </div>

        <!-- 2. Text Embed (if screen is an embed) -->
        <div class="embed-card" id="embed-card" style="display: none;">
          <div class="embed-title" id="embed-title"></div>
          <div class="embed-desc" id="embed-desc"></div>
        </div>

        <!-- 3. Discord Native ActionRows (Pure 1:1 Render of interactionCreate.ts components) -->
        <div class="discord-action-rows" id="action-rows">
          <!-- Rendered dynamically directly from Discord components JSON -->
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentScreen = "title";

    async function loadScreen(screen = "title") {
      currentScreen = screen;
      try {
        const res = await fetch(`/api/initial?screen=${screen}`);
        const data = await res.json();
        renderDiscordPayload(data);
      } catch (err) {
        console.error("Failed to load screen:", err);
      }
    }

    async function onDiscordButtonClick(customId) {
      try {
        const res = await fetch('/api/click', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ customId })
        });
        const data = await res.json();
        renderDiscordPayload(data);
      } catch (err) {
        console.error("Failed to execute button interaction:", err);
      }
    }

    function renderDiscordPayload(data) {
      const canvasCard = document.getElementById('canvas-card');
      const embedCard = document.getElementById('embed-card');
      const canvasImg = document.getElementById('canvas-preview');

      if (data.image) {
        canvasCard.style.display = 'block';
        embedCard.style.display = 'none';
        canvasImg.src = data.image;
      } else if (data.embed) {
        canvasCard.style.display = 'none';
        embedCard.style.display = 'flex';
        document.getElementById('embed-title').textContent = data.embed.title || '';
        document.getElementById('embed-desc').textContent = data.embed.description || '';
      }

      const container = document.getElementById('action-rows');
      container.innerHTML = '';

      if (Array.isArray(data.rows)) {
        data.rows.forEach(row => {
          const rowDiv = document.createElement('div');
          rowDiv.className = 'action-row';

          row.forEach(btn => {
            const btnEl = document.createElement('button');
            btnEl.className = `d-btn btn-${btn.style || 2}`;
            btnEl.textContent = btn.label;
            if (btn.disabled) btnEl.disabled = true;

            btnEl.onclick = () => onDiscordButtonClick(btn.custom_id);
            rowDiv.appendChild(btnEl);
          });

          container.appendChild(rowDiv);
        });
      }
    }

    function onScreenChange() {
      const selected = document.getElementById('screen-select').value;
      loadScreen(selected);
    }

    function reloadCurrentView() {
      loadScreen(currentScreen);
    }

    // Live Hot Reload via SSE
    try {
      const evtSource = new EventSource('/api/live');
      evtSource.onmessage = (event) => {
        if (event.data === 'reload') {
          console.log('[LIVE RELOAD] Source code updated! Refreshing...');
          reloadCurrentView();
        }
      };
    } catch (e) {
      console.warn('SSE connection warning:', e);
    }

    // Load initial screen as Title Screen (The authentic starting point!)
    loadScreen("title");
  </script>
</body>
</html>
